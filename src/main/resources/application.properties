spring.application.name=demandas

# Conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=demandas_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=app_demandas
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate: o schema é criado pelo Flyway, o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Senha provisória do admin inicial (só para uso local)
app.admin.senha=${ADMIN_PASSWORD:Admin@12345}