spring.application.name=demandas

# Porta: o Render define PORT; localmente usa 8080
server.port=${PORT:8080}
# Necessário atrás do proxy do Render (HTTPS)
server.forward-headers-strategy=framework

# PostgreSQL (Supabase, Session pooler)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&currentSchema=demandas
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# O Flyway cria o schema; o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=demandas
spring.flyway.enabled=true
spring.flyway.schemas=demandas
spring.flyway.default-schema=demandas

# Admin inicial (senha obrigatória, e-mail configurável)
app.admin.email=${ADMIN_EMAIL:admin@teste.local}
app.admin.senha=${ADMIN_PASSWORD}

# Sessão
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}